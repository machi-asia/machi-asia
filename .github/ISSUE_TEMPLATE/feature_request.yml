name: Feature Request
description: Propose a new feature or improvement
labels:
  - enhancement
  - triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user or business need does this address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you evaluated and why they fall short.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope Confirmation
      options:
        - label: This requires changes to application code
        - label: This requires infrastructure or CI/CD changes
        - label: This is blocked by another issue
