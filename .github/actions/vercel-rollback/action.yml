name: Vercel Rollback Preview
description: Removes a failed Vercel preview deployment
inputs:
  node-version:
    description: Node.js version used to run the Vercel CLI
    required: false
    default: '22'
  deployment-url:
    description: URL of the deployment to remove
    required: true
  vercel-token:
    description: Vercel token with deployment rights to the project
    required: true
  vercel-org-id:
    description: Vercel team/scope id
    required: true
  vercel-project-id:
    description: Vercel project id
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Remove failed preview deployment
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
        DEPLOYMENT_URL: ${{ inputs.deployment-url }}
      run: npx --yes vercel@latest remove "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
